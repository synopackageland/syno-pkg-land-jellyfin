{
  "schema": 2,
  "package": "SynoPkgJellyfin",
  "version": "12.2",
  "build": 5,
  "displayname": "Jellyfin",
  "icon": "assets/icon.png",
  "description": "Organize and stream your movies, TV shows and music",
  "i18n": {
    "info": {
      "zh-TW": {
        "description": "整理與串流播放你的電影、影集和音樂"
      }
    }
  },
  "maintainer": "Syno Package Land",
  "os_min_ver": "7.2.1-69057",
  "arches": [
    "x86_64"
  ],
  "entry": "app-privilege",
  "capabilities": {
    "composeMounts": true
  },
  "install": {
    "sharedFolder": {
      "mode": "select",
      "key": "media",
      "permission": "ro"
    }
  },
  "compose": {
    "sdk": "0.26.0",
    "files": [
      "compose.yaml"
    ],
    "devices": {
      "gpu": {
        "services": [
          "jellyfin"
        ]
      }
    },
    "shares": {
      "media": {
        "select": "install",
        "mounts": [
          {
            "service": "jellyfin",
            "target": "/media"
          }
        ]
      }
    },
    "startup_timeout_seconds": 600,
    "services": {
      "jellyfin": {
        "network": "host",
        "listener": {
          "env": "JELLYFIN_BIND",
          "format": "host"
        },
        "storage_init": {
          "directories": [
            {
              "base": "/var/tmp",
              "path": "jellyfin"
            }
          ],
          "runtime": {
            "environment": {
              "OIDC_SECRET": {
                "oidc_client": "jellyfin"
              },
              "BOOTSTRAP_PASSWORD": {
                "secret": "bootstrap"
              }
            },
            "files": [
              {
                "target": "/var/tmp/jellyfin/hwa.sh",
                "content": "# Sourced by start.sh before Jellyfin opens its configuration. Same package UID.\nhwa_device() {\n    case \"$1\" in /dev/dri/renderD[0-9][0-9][0-9]) ;; *) return 1;; esac\n    minor=${1#/dev/dri/renderD}\n    [ \"$minor\" -ge 128 ] && [ \"$minor\" -le 191 ]\n}\n\nhwa_write() {\n    hwa_state=$1; hwa_backend=$2; hwa_path=$3\n    case \"$hwa_backend\" in vaapi) hwa_device \"$hwa_path\" || return 1;; none) ;; *) return 1;; esac\n    hwa_config=\"$hwa_state/config/config/encoding.xml\"\n    mkdir -p \"$hwa_state/config/config\"\n    if [ -L \"$hwa_config\" ]; then return 1; fi\n    if [ -f \"$hwa_config\" ]; then\n        # Change native serialized fields only; retain all unrelated user settings.\n        # If a future upstream format differs, leave it untouched and fail safely.\n        grep -q '</EncodingOptions>' \"$hwa_config\" || return 1\n        sed \"s|<HardwareAccelerationType>[^<]*</HardwareAccelerationType>|<HardwareAccelerationType>$hwa_backend</HardwareAccelerationType>|g\" \"$hwa_config\" > \"$hwa_config.pending\"\n        if ! grep -q '<HardwareAccelerationType>' \"$hwa_config.pending\"; then\n            sed \"s|</EncodingOptions>|<HardwareAccelerationType>$hwa_backend</HardwareAccelerationType></EncodingOptions>|\" \"$hwa_config.pending\" > \"$hwa_config.pending2\"\n            mv \"$hwa_config.pending2\" \"$hwa_config.pending\"\n        fi\n        if [ \"$hwa_backend\" = vaapi ]; then\n            sed \"s|<VaapiDevice>[^<]*</VaapiDevice>|<VaapiDevice>$hwa_path</VaapiDevice>|g; s|<EnableHardwareEncoding>[^<]*</EnableHardwareEncoding>|<EnableHardwareEncoding>true</EnableHardwareEncoding>|g\" \"$hwa_config.pending\" > \"$hwa_config.pending2\"\n            mv \"$hwa_config.pending2\" \"$hwa_config.pending\"\n            if ! grep -q '<VaapiDevice>' \"$hwa_config.pending\"; then\n                sed \"s|</EncodingOptions>|<VaapiDevice>$hwa_path</VaapiDevice></EncodingOptions>|\" \"$hwa_config.pending\" > \"$hwa_config.pending2\"\n                mv \"$hwa_config.pending2\" \"$hwa_config.pending\"\n            fi\n        fi\n    elif [ \"$hwa_backend\" = vaapi ]; then\n        printf '<?xml version=\"1.0\"?><EncodingOptions><HardwareAccelerationType>vaapi</HardwareAccelerationType><VaapiDevice>%s</VaapiDevice><EnableHardwareEncoding>true</EnableHardwareEncoding><HardwareDecodingCodecs><string>h264</string></HardwareDecodingCodecs></EncodingOptions>\\n' \"$hwa_path\" > \"$hwa_config.pending\"\n    else\n        return 0\n    fi\n    chmod 600 \"$hwa_config.pending\"\n    mv \"$hwa_config.pending\" \"$hwa_config\"\n}\n\nhwa_probe() {\n    # Cold shared-library/driver loads can exceed 15s on disk-backed devices.\n    if timeout -k 5 60 /usr/lib/jellyfin-ffmpeg/ffmpeg -hide_banner -loglevel error -init_hw_device \"vaapi=va:$1\" -filter_hw_device va -f lavfi -i color=s=64x64:r=1 -vf format=nv12,hwupload -frames:v 1 -c:v h264_vaapi -f null - >/dev/null 2>&1; then\n        return 0\n    else\n        hwa_probe_status=$?\n        printf 'VAAPI probe failed (exit %s).\\n' \"$hwa_probe_status\" >&2\n        return \"$hwa_probe_status\"\n    fi\n}\n\nhwa_setup() {\n    hwa_state=$1\n    hwa_path=${SYNOPKGLAND_GPU_DEVICE:-}\n    if [ \"${SYNOPKGLAND_GPU_STATUS:-software}\" = available ] && hwa_device \"$hwa_path\" && [ -c \"$hwa_path\" ] && [ -r \"$hwa_path\" ] && [ -w \"$hwa_path\" ] &&\n        hwa_probe \"$hwa_path\"; then\n        if [ ! -f \"$hwa_state/hwa.initialized\" ]; then\n            hwa_write \"$hwa_state\" vaapi \"$hwa_path\" || return 1\n            : > \"$hwa_state/hwa.initialized\"\n        fi\n        printf '%s\\n' 'GPU render device ready; native encoding settings retained.'\n    else\n        hwa_write \"$hwa_state\" none '' || return 1\n        rm -f \"$hwa_state/hwa.initialized\"\n        printf '%s\\n' 'Hardware acceleration unavailable; using software transcoding.'\n    fi\n}\n"
              },
              {
                "target": "/var/tmp/jellyfin/start.sh",
                "content": "#!/bin/sh\n# Runtime runs only as the package UID. No upstream source or image is changed.\nset -eu\numask 077\nstate=/var/tmp/jellyfin\nplugin=\"$state/config/plugins/SSO Authentication_4.0.0.4\"\nmkdir -p \"$plugin\" \"$state/config/config\" \"$state/cache\"\n. \"$state/hwa.sh\"\nhwa_setup \"$state\"\n# Build-verified release files arrive in bounded base64 argv chunks, never downloaded at startup.\nwhile [ \"$#\" -gt 0 ]; do\n    file=$1; hash=$2; count=${3#chunks:}; shift 3\n    case \"$file\" in SSO-Auth.dll|Duende.IdentityModel.dll|Duende.IdentityModel.OidcClient.dll|meta.json) ;; *) exit 1;; esac\n    : > \"$plugin/$file.pending\"\n    while [ \"$count\" -gt 0 ]; do\n        printf '%s' \"$1\" | base64 -d >> \"$plugin/$file.pending\"\n        shift; count=$((count-1))\n    done\n    printf '%s  %s\\n' \"$hash\" \"$plugin/$file.pending\" | sha256sum -c - >/dev/null\n    mv \"$plugin/$file.pending\" \"$plugin/$file\"\ndone\n[ \"${JELLYFIN_BIND:?}\" = 127.0.0.1 ] || exit 1\ncase \"${OIDC_SECRET:?}${BOOTSTRAP_PASSWORD:?}\" in *[!0-9a-f]*) exit 1;; esac\n[ \"${#OIDC_SECRET}\" -eq 64 ] && [ \"${#BOOTSTRAP_PASSWORD}\" -eq 64 ] || exit 1\n# The SDK may regenerate secrets after delete-data while named volumes remain.\n# Retain only the native bootstrap credential in the same private App volume.\nif [ ! -f \"$state/bootstrap.secret\" ]; then\n    printf '%s' \"$BOOTSTRAP_PASSWORD\" > \"$state/bootstrap.secret\"\nfi\nBOOTSTRAP_PASSWORD=$(cat \"$state/bootstrap.secret\")\ncase \"$BOOTSTRAP_PASSWORD\" in *[!0-9a-f]*) exit 1;; esac\n[ \"${#BOOTSTRAP_PASSWORD}\" -eq 64 ] || exit 1\noidc_fingerprint=$(printf '%s' \"$OIDC_SECRET\" | sha256sum | cut -d ' ' -f 1)\nbudget=${SYNOPKGLAND_STARTUP_BUDGET_SECONDS:?}\ncase \"$budget\" in ''|*[!0-9]*) exit 1;; esac\ndeadline=$(($(date +%s)+budget))\nnetwork() {\n    printf '<?xml version=\"1.0\"?><NetworkConfiguration><InternalHttpPort>%s</InternalHttpPort><EnableHttps>false</EnableHttps><EnableIPv4>true</EnableIPv4><EnableIPv6>false</EnableIPv6><AutoDiscovery>false</AutoDiscovery><EnableUPnP>false</EnableUPnP><LocalNetworkAddresses><string>%s</string></LocalNetworkAddresses><KnownProxies><string>127.0.0.1</string></KnownProxies></NetworkConfiguration>\\n' \"$1\" \"$JELLYFIN_BIND\" > \"$state/config/config/network.xml\"\n}\ncleanup_secrets() { rm -f \"$state/auth.json\" \"$state/curl-auth.conf\" \"$state/provider-live.json\" \"$state/library-list.json\"; }\ntrap cleanup_secrets EXIT\nserver=''\nstop() { cleanup_secrets; if [ -n \"$server\" ]; then kill \"$server\" 2>/dev/null || true; wait \"$server\" 2>/dev/null || true; fi; }\ntrap 'stop; exit 1' INT TERM HUP\nif [ ! -f \"$state/bootstrap.complete\" ] || [ \"$(cat \"$state/oidc.fingerprint\" 2>/dev/null || true)\" != \"$oidc_fingerprint\" ]; then\n    network 29497\n    /jellyfin/jellyfin &\n    server=$!\n    until [ \"$(curl -fsS --max-time 2 http://127.0.0.1:29497/health 2>/dev/null || true)\" = Healthy ]; do\n        kill -0 \"$server\" 2>/dev/null || { echo 'Bootstrap server failed' >&2; exit 1; }\n        [ \"$(date +%s)\" -lt \"$deadline\" ] || { stop; echo 'Bootstrap deadline exceeded' >&2; exit 1; }\n        sleep 1\n    done\n    api=http://127.0.0.1:29497\n    info=$(curl -fsS --max-time 10 \"$api/System/Info/Public\")\n    if ! printf '%s' \"$info\" | grep -iq '\"StartupWizardCompleted\"[[:space:]]*:[[:space:]]*true'; then\n        curl -fsS --max-time 10 \"$api/Startup/User\" >/dev/null\n        printf '{\"Name\":\"package-bootstrap\",\"Password\":\"%s\"}' \"$BOOTSTRAP_PASSWORD\" > \"$state/auth.json\"\n        curl -fsS --max-time 10 -H 'Content-Type: application/json' -X POST --data-binary @\"$state/auth.json\" \"$api/Startup/User\" >/dev/null\n        curl -fsS --max-time 10 -X POST \"$api/Startup/Complete\" >/dev/null\n    fi\n    printf '{\"Username\":\"package-bootstrap\",\"Pw\":\"%s\"}' \"$BOOTSTRAP_PASSWORD\" > \"$state/auth.json\"\n    response=$(curl -fsS --max-time 10 -H 'Content-Type: application/json' -H 'Authorization: MediaBrowser Client=\"Package Setup\", Device=\"Package\", DeviceId=\"package-bootstrap\", Version=\"1\"' --data-binary @\"$state/auth.json\" \"$api/Users/AuthenticateByName\")\n    token=$(printf '%s' \"$response\" | sed -n 's/.*\"AccessToken\"[[:space:]]*:[[:space:]]*\"\\([0-9a-fA-F]*\\)\".*/\\1/p')\n    [ -n \"$token\" ] || { stop; echo 'Bootstrap authentication failed' >&2; exit 1; }\n    printf 'header = \"Authorization: MediaBrowser Token=%s\"\\n' \"$token\" > \"$state/curl-auth.conf\"\n    sed \"s/__CLIENT_SECRET__/$OIDC_SECRET/g\" \"$state/provider.json\" > \"$state/provider-live.json\"\n    curl -fsS --max-time 10 -K \"$state/curl-auth.conf\" -H 'Content-Type: application/json' --data-binary @\"$state/provider-live.json\" \"$api/sso/OID/Add/dsm\" >/dev/null\n    # The supported branding API provides a one-click fallback after native hash-route logout.\n    curl -fsS --max-time 10 -K \"$state/curl-auth.conf\" -H 'Content-Type: application/json' --data-binary @\"$state/branding.json\" \"$api/System/Configuration/Branding\" >/dev/null\n    curl -fsS --max-time 10 -K \"$state/curl-auth.conf\" \"$api/Library/VirtualFolders\" > \"$state/library-list.json\"\n    if ! grep -q '\"Name\"[[:space:]]*:[[:space:]]*\"Media\"' \"$state/library-list.json\"; then\n        curl -fsS --max-time 10 -K \"$state/curl-auth.conf\" -H 'Content-Type: application/json' --data-binary @\"$state/library.json\" \"$api/Library/VirtualFolders?name=Media&collectionType=movies&refreshLibrary=false\" >/dev/null\n    fi\n    printf '%s' \"$oidc_fingerprint\" > \"$state/oidc.fingerprint\"\n    kill \"$server\"; wait \"$server\" || true; server=''\nfi\n# Only the final, configured server uses the SDK health/listen port.\nnetwork 29496\nif [ -f \"$state/bootstrap.complete\" ]; then\n    cleanup_secrets\n    trap - INT TERM HUP\n    exec /jellyfin/jellyfin\nfi\n/jellyfin/jellyfin &\nserver=$!\nuntil [ \"$(curl -fsS --max-time 2 http://127.0.0.1:29496/health 2>/dev/null || true)\" = Healthy ]; do\n    kill -0 \"$server\" 2>/dev/null || { cleanup_secrets; exit 1; }\n    [ \"$(date +%s)\" -lt \"$deadline\" ] || { stop; exit 1; }\n    sleep 1\ndone\n# A refresh is asynchronous: request it from the final process, which remains alive.\ncurl -fsS --max-time 10 -K \"$state/curl-auth.conf\" -X POST http://127.0.0.1:29496/Library/Refresh >/dev/null\ncleanup_secrets\n: > \"$state/bootstrap.complete\"\nwait \"$server\"\n"
              },
              {
                "target": "/var/tmp/jellyfin/provider.json",
                "content": "{\"OidEndpoint\": \"http://127.0.0.1:29490\", \"OidClientId\": \"jellyfin\", \"OidSecret\": \"__CLIENT_SECRET__\", \"Enabled\": true, \"EnableAuthorization\": true, \"EnableAllFolders\": true, \"AdminRoles\": [\"admin\"], \"Roles\": [], \"RoleClaim\": \"groups\", \"OidScopes\": [\"groups\"], \"DefaultUsernameClaim\": \"sub\", \"EnableLiveTv\": false, \"EnableLiveTvManagement\": false, \"NewPath\": true, \"SchemeOverride\": \"https\", \"DisableHttps\": true, \"DisablePushedAuthorization\": true, \"DoNotValidateEndpoints\": false, \"DoNotValidateIssuerName\": false}"
              },
              {
                "target": "/var/tmp/jellyfin/branding.json",
                "content": "{\"LoginDisclaimer\": \"<form action=\\\"/sso/OID/start/dsm\\\"><button class=\\\"raised block emby-button button-submit\\\">Sign in with DSM</button></form>\", \"CustomCss\": \".disclaimerContainer { display: block; }\"}"
              },
              {
                "target": "/var/tmp/jellyfin/library.json",
                "content": "{\"LibraryOptions\": {\"PathInfos\": [{\"Path\": \"/media\"}], \"EnableRealtimeMonitor\": false, \"EnableInternetProviders\": false, \"EnableAutomaticSeriesGrouping\": false}}"
              }
            ]
          }
        }
      }
    },
    "web": {
      "service": "jellyfin",
      "port": 29496,
      "health": {
        "path": "/System/Ping",
        "status": 200
      }
    },
    "network": {
      "egress": "internet"
    }
  },
  "identity_gateway": {
    "sdk": "0.26.0",
    "mode": "oidc",
    "access": "dsm-users",
    "listen": {
      "https": 29443
    },
    "oidc": {
      "issuer_port": 29490,
      "clients": [
        {
          "id": "jellyfin",
          "redirect_paths": [
            "/sso/OID/redirect/dsm"
          ],
          "pkce": true
        }
      ]
    }
  },
  "ui": {
    "launch": "new-page"
  }
}
